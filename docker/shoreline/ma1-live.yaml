# Live mA1 defaults. Edit lidar_topic and frames to match your publishers.
# Same geometry/filter settings as the package's recorded mA1 configuration.
lidar_water_projection:
  ros__parameters:
    lidar_topic: /front_lidar/ouster/points
    water_frame: ma1_water_plane
    global_frame: piren
    global_tf_use_latest: false
    water_level_m: 0.0
    min_height_m: 0.0
    max_height_m: 2.0
    sector_width_deg: 2.0
    min_sector_points: 5
    range_cluster_m: 0.5
    min_range_m: 1.0
    max_range_m: 150.0
    max_segment_m: 3.0
